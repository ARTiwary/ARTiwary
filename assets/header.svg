<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Ayush Raj Tiwary: full stack developer, AI/ML builder, cricketer. A cricket ball travels its delivery path toward the stumps." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="m" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#7FB3E6" stroke-opacity=".09"/></pattern>
    <pattern id="M" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#7FB3E6" stroke-opacity=".2"/></pattern>
  </defs>
  <rect width="1000" height="340" rx="18" fill="#0E1B2C"/>
  <rect width="1000" height="340" rx="18" fill="url(#m)"/>
  <rect width="1000" height="340" rx="18" fill="url(#M)"/>
  <rect x="12" y="12" width="976" height="316" rx="10" fill="none" stroke="#EAF2FB" stroke-opacity=".35" stroke-dasharray="2 6"/>

  <!-- name -->
  <text x="56" y="112" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="56" fill="#EAF2FB" letter-spacing="-1">Ayush Raj Tiwary</text>
  <path d="M58 128 C 150 120, 230 134, 330 126 S 450 130, 500 124" fill="none" stroke="#E2432F" stroke-width="4" stroke-linecap="round" stroke-dasharray="460" stroke-dashoffset="460">
    <animate attributeName="stroke-dashoffset" from="460" to="0" dur="1.4s" begin="0.3s" fill="freeze"/>
  </path>

  <!-- rotating roles -->
  <g font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="19" fill="#F2A93B">
    <text x="58" y="168" opacity="0">builds full stack products
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.28;.33;1" dur="9s" begin="0s" repeatCount="indefinite"/></text>
    <text x="58" y="168" opacity="0">teaches machines to read MRI scans
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.28;.33;1" dur="9s" begin="3s" repeatCount="indefinite"/></text>
    <text x="58" y="168" opacity="0">bowls a good line, ships on time
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.28;.33;1" dur="9s" begin="6s" repeatCount="indefinite"/></text>
  </g>

  <!-- pitch + delivery -->
  <line x1="50" y1="300" x2="740" y2="300" stroke="#EAF2FB" stroke-opacity=".5"/>
  <path d="M70 290 Q400 130 700 284" fill="none" stroke="#F2A93B" stroke-opacity=".75" stroke-dasharray="3 7" stroke-width="1.6"/>
  <circle cx="70" cy="290" r="4" fill="none" stroke="#EAF2FB"/>
  <g stroke="#7FB3E6" stroke-opacity=".8" fill="none" font-family="monospace" font-size="11">
    <path d="M70 318 H700 M70 312 V324 M700 312 V324"/>
  </g>
  <text x="385" y="314" text-anchor="middle" font-family="monospace" font-size="11" fill="#7FB3E6">20.12 m</text>
  <text x="250" y="206" font-family="monospace" font-size="11" fill="#7FB3E6" transform="rotate(-17 250 206)">good length, off stump</text>

  <!-- stumps -->
  <g stroke="#EAF2FB" stroke-width="3" stroke-linecap="round">
    <path d="M708 300V242M722 300V242M736 300V242"/>
    <path d="M710 241H720M724 241H734" stroke="#E2432F"/>
  </g>

  <!-- ball -->
  <g>
    <circle r="9" fill="#E2432F"/>
    <path d="M-7 -3 Q0 1 7 -3 M-7 3 Q0 7 7 3" fill="none" stroke="#EAF2FB" stroke-width="1.2" stroke-dasharray="2 1.6"/>
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M70 290 Q400 130 700 284" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
  </g>

  <!-- title block -->
  <g font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="11" fill="#EAF2FB">
    <rect x="770" y="224" width="198" height="88" fill="#0E1B2C" stroke="#EAF2FB" stroke-opacity=".7"/>
    <path d="M770 252H968M770 282H968M850 252V312" stroke="#EAF2FB" stroke-opacity=".5" fill="none"/>
    <text x="780" y="243" fill="#F2A93B" font-size="12">B.Tech CSE, 2027</text>
    <text x="780" y="271" fill="#7FB3E6">drawn by</text><text x="860" y="271">A. R. Tiwary</text>
    <text x="780" y="301" fill="#7FB3E6">sheet</text><text x="860" y="301">01 of 01</text>
  </g>
  <text x="958" y="52" text-anchor="end" font-family="'SFMono-Regular',Consolas,monospace" font-size="12" fill="#7FB3E6">Ranchi, Jharkhand</text>
</svg>
