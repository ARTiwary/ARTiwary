<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Spice Garden: AI dining assistant with eight agents orbiting an orchestrator named Zara" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#7FB3E6" stroke-opacity=".09"/></pattern></defs>
  <rect width="480" height="270" rx="14" fill="#0E1B2C"/><rect width="480" height="270" rx="14" fill="url(#g)"/>
  <rect x="8" y="8" width="464" height="254" rx="8" fill="none" stroke="#EAF2FB" stroke-opacity=".3" stroke-dasharray="2 6"/>
  <text x="28" y="56" font-family="Georgia,serif" font-style="italic" font-size="32" fill="#EAF2FB">Spice Garden</text>
  <path d="M30 66 C80 61 130 69 190 63" stroke="#F2A93B" stroke-width="3" fill="none" stroke-linecap="round"/>
  <g font-family="'Trebuchet MS',Verdana,sans-serif" font-size="14" fill="#EAF2FB">
    <text x="28" y="100">Scan the table QR, chat with Zara,</text>
    <text x="28" y="120">order food. No waiter needed.</text>
  </g>
  <g font-family="'SFMono-Regular',Consolas,monospace" font-size="12" fill="#F2A93B">
    <text x="28" y="156">8 specialised agents</text>
    <text x="28" y="176">live group ordering</text>
    <text x="28" y="196">multilingual</text>
  </g>
  <g font-family="'SFMono-Regular',Consolas,monospace" font-size="11" fill="#7FB3E6">
    <text x="28" y="232">Next.js, Node, PostgreSQL,</text>
    <text x="28" y="248">ChromaDB, Groq, Redis</text>
  </g>
  <!-- orbit diagram -->
  <g transform="translate(375 140)">
    <circle r="78" fill="none" stroke="#7FB3E6" stroke-opacity=".5" stroke-dasharray="3 5"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      <g fill="#0E1B2C" stroke="#EAF2FB" stroke-width="1.4">
        <circle cx="0" cy="-78" r="9"/><circle cx="55" cy="-55" r="9"/><circle cx="78" cy="0" r="9"/><circle cx="55" cy="55" r="9"/>
        <circle cx="0" cy="78" r="9"/><circle cx="-55" cy="55" r="9"/><circle cx="-78" cy="0" r="9"/><circle cx="-55" cy="-55" r="9"/>
      </g>
      <g stroke="#7FB3E6" stroke-opacity=".35"><path d="M0 -36V-69M26 -26L49 -49M36 0H69M26 26L49 49M0 36V69M-26 26L-49 49M-36 0H-69M-26 -26L-49 -49"/></g>
    </g>
    <circle r="34" fill="#E2432F"/>
    <circle r="34" fill="none" stroke="#E2432F" stroke-opacity=".5"><animate attributeName="r" values="34;46;34" dur="3s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".6;0;.6" dur="3s" repeatCount="indefinite"/></circle>
    <text y="6" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="21" fill="#EAF2FB">Zara</text>
  </g>
</svg>
