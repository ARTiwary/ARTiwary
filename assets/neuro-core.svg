<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="NEURO-CORE: brain tumour MRI detection with 94.81 percent accuracy, controlled by hand gestures" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#7FB3E6" stroke-opacity=".09"/></pattern></defs>
  <rect width="480" height="270" rx="14" fill="#0E1B2C"/><rect width="480" height="270" rx="14" fill="url(#g)"/>
  <rect x="8" y="8" width="464" height="254" rx="8" fill="none" stroke="#EAF2FB" stroke-opacity=".3" stroke-dasharray="2 6"/>
  <text x="28" y="56" font-family="Georgia,serif" font-style="italic" font-size="32" fill="#EAF2FB">NEURO-CORE</text>
  <path d="M30 66 C80 61 130 69 200 63" stroke="#E2432F" stroke-width="3" fill="none" stroke-linecap="round"/>
  <g font-family="'Trebuchet MS',Verdana,sans-serif" font-size="14" fill="#EAF2FB">
    <text x="28" y="100">Finds brain tumours in MRI scans.</text>
    <text x="28" y="120">Controlled by waving your hand.</text>
  </g>
  <text x="28" y="172" font-family="Georgia,serif" font-size="46" fill="#F2A93B">94.81%</text>
  <g font-family="'SFMono-Regular',Consolas,monospace" font-size="12" fill="#F2A93B">
    <text x="28" y="194">across 4 tumour types</text>
  </g>
  <g font-family="'SFMono-Regular',Consolas,monospace" font-size="11" fill="#7FB3E6">
    <text x="28" y="232">PyTorch, FastAPI, OpenCV,</text>
    <text x="28" y="248">MediaPipe, Three.js</text>
  </g>
  <!-- scan -->
  <g transform="translate(375 140)">
    <ellipse rx="70" ry="82" fill="none" stroke="#EAF2FB" stroke-width="1.6"/>
    <path d="M0 -80 C-14 -40 14 -20 0 0 C-14 25 14 45 0 80" fill="none" stroke="#7FB3E6" stroke-opacity=".6"/>
    <path d="M-62 -30 C-40 -50 -30 -20 -10 -34 M62 -30 C40 -50 30 -20 10 -34 M-60 30 C-40 14 -28 40 -10 28 M60 30 C40 14 28 40 10 28" fill="none" stroke="#7FB3E6" stroke-opacity=".5"/>
    <circle cx="30" cy="-14" r="16" fill="#E2432F" fill-opacity=".5"><animate attributeName="r" values="12;20;12" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="-14" r="6" fill="#E2432F"/>
    <path d="M30 -40V12M4 -14H56" stroke="#F2A93B" stroke-width="1.2"/>
    <line x1="-72" x2="72" y1="-82" y2="-82" stroke="#F2A93B" stroke-opacity=".8" stroke-width="1.5">
      <animate attributeName="y1" values="-82;82;-82" dur="5s" repeatCount="indefinite"/><animate attributeName="y2" values="-82;82;-82" dur="5s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
